name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  server-ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: watchparty_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./server

      - name: Generate Prisma Client
        run: npm run prisma:generate
        working-directory: ./server

      - name: Deploy Prisma Migrations
        run: npx prisma migrate deploy
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/watchparty_test?schema=public

      - name: Lint
        run: npm run lint
        working-directory: ./server

      - name: Typecheck
        run: npm run typecheck
        working-directory: ./server

      - name: Test
        run: npm run test
        working-directory: ./server
        env:
          PORT: 3001
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/watchparty?schema=public
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/watchparty_test?schema=public
          JWT_SECRET: test-jwt-secret
          CORS_ORIGIN: http://localhost:5173
          CLIENT_URL: http://localhost:5173

      - name: Build
        run: npm run build
        working-directory: ./server

  client-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./client

      - name: Lint
        run: npm run lint
        working-directory: ./client

      - name: Typecheck
        run: npm run typecheck
        working-directory: ./client

      - name: Build
        run: npm run build
        working-directory: ./client
